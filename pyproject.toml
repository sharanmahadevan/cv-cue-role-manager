[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-cue-role-manager"
version = "0.1.0"
description = "Web app to manage Arista CV-CUE role profile firewall rules as shared, versioned rule sets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
cv-cue-role-manager = "cvcue_roles.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvcue_roles"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/cvcue_roles/web/pages.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
