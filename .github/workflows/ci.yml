name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  # Deploys main to Fly after the tests pass. Skipped until the FLY_API_TOKEN secret exists.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Health check
        if: env.FLY_API_TOKEN != ''
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://$app.fly.dev/healthz"
      - name: No deploy token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set; skipped the Fly deploy."
